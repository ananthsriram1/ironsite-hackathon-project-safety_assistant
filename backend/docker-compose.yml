services:

  ml:
    build:
      context: .
      args:
        HF_TOKEN: ${HF_TOKEN}
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - db_data:/app/data
      - ./models:/app/models   # mount pre-downloaded models (sam3.pt, qwen3-vl/)
    environment:
      - VLM_MODEL_ID=${VLM_MODEL_ID:-Qwen/Qwen3-VL-8B-Instruct}
      - VLM_MAX_PIXELS=${VLM_MAX_PIXELS:-100352}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  db_data:
